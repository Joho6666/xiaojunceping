name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi
          npm rebuild better-sqlite3

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Tests
        run: |
          npm run test:reports
          npm run test:knowledge
          npm run test:knowledge-coverage
          npm run test:local-discovery
          npm run test:customization
          npm run test:prompt
          npm run test:discovery
          npm run test:cli
          npm run test:report-store
          npm run test:golden
          npm run test:live-integrity
          npm run test:requirements
          npm run test:retrieval
          npm run test:ranking
          npm run test:verification
          npm run test:readiness
          npm run test:traceability
          npm run test:benchmark
          npm run test:history
          npm run test:evidence-integrity
          npm run test:hybrid-scoring
          npm run test:embedding-cache
          npm run test:unknown-classification
          npm run test:plan-version
          npm run test:task-dag
          npm run test:model-verification
          npm run test:expert-pipeline
          npm run test:benchmark-regression

      - name: Build
        run: npm run build --if-present